[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "Infraestrutura auditável para pesquisa quantitativa"
requires-python = ">=3.11"
dependencies = [
    # Leitura de configuração YAML.
    "pyyaml==6.0.3",
    # Cliente WebSocket do coletor de velas (somente leitura).
    "websocket-client==1.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
