# Modo DEMO — execução demonstrativa (MASTER_SPEC seção 3.2, 71).
# Entrada em DEMO continua condicionada a Broker Risk = PASS (seção 16.1, 67).
mode: DEMO

execution:
  enabled: true

real:
  enabled: false

human_approval:
  required: true

kill_switch:
  enabled: true

capital_scenarios:
  - 100
  - 300
  - 500
  - 700
  - 1000

validation:
  min_fold_pass_ratio: 1.0
  min_sample_size: 200
  walk_forward_folds: 5
  monte_carlo_runs: 1000

research:
  max_experiments_per_cycle: 10
  max_retries_per_agent: 3
  max_parameter_variations: 24

risk:
  risk_per_trade: 0.02
  max_drawdown_limit: 0.30
  max_risk_of_ruin: 0.05

# ADR-007: DEMO não envolve depósito, então o gate de contraparte não bloqueia.
# Se algum dia houver REAL, este valor volta a ser true e a avaliação é refeita.
broker_risk:
  blocking: false
