# Modo RESEARCH — nenhuma operação é enviada (MASTER_SPEC seção 3.1, 70).
mode: RESEARCH

execution:
  enabled: false

real:
  enabled: false

human_approval:
  required: true

kill_switch:
  enabled: true

capital_scenarios:
  - 100
  - 300
  - 500
  - 700
  - 1000

validation:
  # ADR-004: 100% dos folds precisam ter expectancy > 0.
  min_fold_pass_ratio: 1.0
  min_sample_size: 200
  walk_forward_folds: 5
  monte_carlo_runs: 1000

research:
  max_experiments_per_cycle: 10
  max_retries_per_agent: 3
  max_parameter_variations: 24

risk:
  risk_per_trade: 0.02
  max_drawdown_limit: 0.30
  max_risk_of_ruin: 0.05

# ADR-007: em RESEARCH não há capital em risco, então o gate de contraparte
# é informativo. O relatório continua registrando o que for apurado.
broker_risk:
  blocking: false
